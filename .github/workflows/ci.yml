name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci

      - name: Lint
        run: |
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build
        run: npm run build

      - name: Test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --audit-level=high
